services:

  db:
     image: mysql:8.4.0
     # ❕ No container name (Docker handles it automatically)
     ports:
       - ${DB_PORT}:3306
     environment:
       - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
       - MYSQL_DATABASE=${DB_NAME}
     volumes:
       # ❕ Not hardcoded
       - db_data:/var/lib/mysql
volumes:
  # ❕ Declare named volume
  db_data:
