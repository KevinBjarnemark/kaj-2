name: Deploy Frontend

on:
  push:
    tags:
      - 'frontend/v*'   # ❕ Matches: frontend/v1.0.0, frontend/v2.1.3, etc.
  workflow_dispatch: # ❕ Enables manual re-trigger from GitHub UI

defaults:
  run:
    working-directory: frontend  # ❕ All steps run from /frontend


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Verify tag is on main # ⚠️ SECURITY STEP - Only deploy from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor ${{ github.sha }} origin/main || (echo "Tag must be on main" && exit 1)
          
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ❕ Full history — safe default if build reads git metadata

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci # ❕ Strict lockfile install — correct for reproducible CI builds

      # ❕ TODO - Add tests here
      # - name: Test
        #   run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --dir=out
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_PROJECT_ID: ${{ secrets.NETLIFY_PROJECT_ID }}
